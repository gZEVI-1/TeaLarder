[project]
name = "tea_larder"
version = "0.0.0"
description = "Чайный учёт"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=6.1",
    "djangorestframework>=3.14",
    "django-cors-headers>=4.0",
    "Pillow>=12.0",
    "customtkinter>=5.0",
    "requests>=2.31",
    "python-dotenv",
]
[tool.setuptools]
packages=["tea_larder"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"